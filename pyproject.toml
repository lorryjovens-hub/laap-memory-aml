[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laap-memory-aml"
version = "1.0.1"
description = "LAAP Memory — Agent Memory Leaderboard (AML) Add/Search memory service"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.urls]
Homepage = "https://aml.laap.cn"
Source = "https://github.com/<org>/laap-memory-aml"

[tool.setuptools.packages.find]
include = ["laap*"]
